    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const renderStage = window.createEvolutStage(document.querySelector("#stage"));
    const playhead = { seconds:0 };
    renderStage(0);
    tl.to(playhead, { seconds:63, duration:63, ease:"none", onUpdate:() => renderStage(playhead.seconds) }, 0);
    for (const [at, opacity] of [[.88,.24],[23.30,.16],[34.77,.22],[41.39,.27],[46.01,.22],[54.41,.33]]) {
      tl.fromTo("#camera-halo", { scale:.72, opacity:0 }, {
        scale:1.09, opacity, duration:.10, ease:"power2.out", immediateRender:false
      }, at);
      tl.to("#camera-halo", { opacity:0, duration:.62, ease:"power2.out" }, at + .10);
    }
    window.__timelines.main = tl;
