          (function () {

            var root = document.getElementById("root");
            var cardA = root.querySelector('[data-focus-card="a"]');
            var cardB = root.querySelector('[data-focus-card="b"]');
            var vars =

            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "6.5"));

            var SWAP_DURATION = Math.min(0.85, Math.max(0.001, duration - SWAP_START));

            gsap.set(initialFocused, { opacity: 1, scale: 1, filter: sharp });
            gsap.set(targetFocused, { opacity: dim, scale: 0.94, filter: blurred });

            var tl = gsap.timeline({ paused: true });
            tl.to(
              initialFocused,
              {
                opacity: dim,
                scale: 0.94,
                filter: blurred,
                duration: SWAP_DURATION,
                ease: "power2.out",
              },
              SWAP_START,

            tl.to(
              targetFocused,
              {
                opacity: 1,
                scale: 1,
                filter: sharp,
                duration: SWAP_DURATION,
                ease: "power2.out",
              },
              SWAP_START,
            );

            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines["focus-swap"] = tl;
